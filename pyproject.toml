[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "vital-detect"
version = "1.1.0"
description = "Team Round 1 baseline and synchronized UBFC evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy==1.14.1",
  "opencv-contrib-python>=4.10,<4.12",
  "matplotlib>=3.8,<3.11",
  "mediapipe==0.10.21",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "ruff>=0.11,<0.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["Round1_Baseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
Round1_Baseline = ["*.m", "*.ipynb", "notes.txt"]
