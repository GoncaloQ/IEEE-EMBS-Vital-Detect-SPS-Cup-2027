name: Synthetic HR pipeline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-14
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux video dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libegl1 libgles2 libportaudio2
      - name: macOS video dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: vital-detect --help
      - run: ruff check src tests Round1_Baseline/process_round1.py
      - run: python -m pytest -q
